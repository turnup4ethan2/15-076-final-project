name: water
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.0
  - "numpy<2"  # required by pip-installed torch 2.2 on Apple Silicon
  - scipy
  - requests
  - pyarrow
  - openpyxl
  - netcdf4
  - xarray
  - geopandas
  - shapely
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - tqdm
  - jupyter
  - ipykernel
  - pip
  - pip:
      - torch  # CPU/MPS build pulled from PyPI — the conda-forge build had resolver conflicts
